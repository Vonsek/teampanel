<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teampanel</title>
<style>
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --line:#EAEAEA; --line2:#DEDCD6;
  --ink:#2F3437; --ink2:#55595C; --ink3:#686763; --strong:#111111;
  --green-bg:#EDF3EC; --green:#346538; --yellow-bg:#FBF3DB; --yellow:#956400;
  --red-bg:#FDEBEC; --red:#9F2F2D; --blue-bg:#E1F3FE; --blue:#1F6C9F;
  --sans:'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif; --serif:var(--sans); --mono:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding:32px 32px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.glyph{display:none}
.brand h1{font:600 36px/1.1 var(--serif);letter-spacing:-.01em;margin:0;color:var(--strong)}
.brand .tag{font:500 12px var(--sans);color:var(--ink3);margin-top:6px;letter-spacing:.02em}
.hud{display:flex;align-items:center;gap:16px;font:13px var(--sans);color:var(--ink3)}
.live{display:none}
#clock{font:500 13px var(--mono);color:var(--ink2)}
.err{color:var(--red)}
.ptabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--card)}
.ptabs button,.seg button{all:unset;cursor:pointer;font:500 13px var(--sans);color:var(--ink3);padding:6px 14px;border-radius:6px}
.ptabs button:hover,.seg button:hover{color:var(--ink)}
.ptabs button.on,.seg button.on{background:var(--strong);color:#fff}
.seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--card)}
.seg button{padding:4px 10px;font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px}
.ptitle{font:600 22px/1.2 var(--serif);letter-spacing:-.01em;color:var(--strong);margin:0 0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ptitle small{font:400 13px var(--sans);color:var(--ink3);letter-spacing:0}
.row{display:grid;gap:20px;margin-bottom:20px}
.r1{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mission{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.pct{font:600 46px/1 var(--serif);letter-spacing:-.01em;color:var(--strong)}
.pct-l{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:6px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);min-width:0}
.step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step b{flex:none;width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;border:1px solid var(--line2);color:transparent}
.step.done,.step.partial{color:var(--ink)}
.step.done b{background:var(--green-bg);border-color:#C9DCC6;color:var(--green)}
.step.partial b{background:var(--yellow-bg);border-color:#EBDDB0;color:var(--yellow)}
.step.big{grid-column:1/-1}
.step .w{margin-left:auto;font:400 12px var(--mono);color:var(--ink3);flex:none}
.note{font-size:13px;color:var(--ink3);margin-top:18px;line-height:1.6}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:128px}
.kpi .k{font:500 13px var(--sans);color:var(--ink3)}
.kpi .v{font:600 44px/1.05 var(--serif);letter-spacing:-.01em;color:var(--strong);margin:10px 0 4px}
.kpi .s{font-size:13px;color:var(--ink3)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;margin-bottom:20px}
.member .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.member h2{margin:0;font:600 24px/1.2 var(--serif);letter-spacing:-.01em;color:var(--strong);display:flex;align-items:center;gap:10px}
.member h2 .sw{width:10px;height:10px;border-radius:2px;background:var(--c)}
.chip{font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:9999px;display:flex;align-items:center;gap:6px}
.chip i{display:none}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.quiet{background:var(--yellow-bg);color:var(--yellow)}
.chip.closed{background:#F1F0EC;color:var(--ink2)}
.local{margin:12px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#FBFBFA;font-size:13px;color:var(--ink2)}
.local b{color:var(--strong);font-weight:600}
.chip.stopped{background:var(--red-bg);color:var(--red)}
.sub{color:var(--ink3);font-size:13px}
.mono{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:18px 0;border:1px solid var(--line);border-radius:8px}
.stat{padding:10px 12px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .n{font:600 24px/1.2 var(--serif);color:var(--strong)}
.stat .l{font-size:12px;color:var(--ink3)}
.spark{height:40px;margin:6px 0 14px;display:block}
.pr{padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.pr a{color:var(--ink);text-decoration:none}.pr a:hover{text-decoration:underline}
.badge{font:600 10px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:9999px;margin-right:8px;background:#F1F0EC;color:var(--ink2);vertical-align:1px}
.badge.MERGED{background:var(--blue-bg);color:var(--blue)}.badge.OPEN{background:var(--green-bg);color:var(--green)}.badge.CLOSED{background:var(--red-bg);color:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:-6px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px}
.axis{fill:var(--ink3);font-size:11px;font-family:var(--sans)}
.rankhero{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.rankhero .big{font:600 48px/1 var(--serif);letter-spacing:-.01em;color:var(--strong)}.rankhero .big small{font:400 16px var(--sans);color:var(--ink3);letter-spacing:0}
.rankhero .txt{font-size:14px;color:var(--ink2);max-width:440px}
.rankhero .txt b{color:var(--strong);font-weight:600}
.lb{display:grid;gap:2px}
.lbr{display:grid;grid-template-columns:28px 160px 1fr 48px;gap:12px;align-items:center;font-size:14px;padding:5px 8px;border-radius:6px}
.lbr .rk{font:400 12px var(--mono);color:var(--ink3);text-align:right}
.lbr .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .bar{height:8px;border-radius:2px;background:#F1F0EC;overflow:hidden}.lbr .bar i{display:block;height:100%;border-radius:2px;background:#C9C7C0}
.lbr .v{font:500 13px var(--mono);text-align:right;color:var(--ink)}
.lbr.me{background:var(--blue-bg)}.lbr.me .nm{color:var(--strong);font-weight:600}.lbr.me .bar i{background:var(--blue)}
.lbr.owner .nm::after{content:" · ägare";font-size:12px;color:var(--ink3)}
.feed{max-height:560px;overflow:auto}
.ev{display:grid;grid-template-columns:10px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .dot{width:8px;height:8px;border-radius:2px;margin-top:7px}
.ev .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink3)}
.ev .txt{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev a{color:inherit;text-decoration:none}.ev a:hover .txt{text-decoration:underline}
.kind{font:600 11px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--strong);color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;display:none}
@media (max-width:1100px){.r1,.r3{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:20px 16px 40px}.brand h1{font-size:28px}.hud{width:100%}
  .panel{padding:20px}.mission{grid-template-columns:1fr;justify-items:center}.steps{grid-template-columns:1fr;width:100%}
  .kpis{gap:12px}.kpi{padding:16px;min-height:100px}.kpi .v{font-size:34px}
  .members{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}
  .lbr{grid-template-columns:24px 110px 1fr 40px;gap:8px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="glyph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9feaff" stroke-width="1.8"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c1-3 3-4 5-4s4 1 5 4M11 19c1-3 3-4 5-4s4 1 5 4"/></svg></div>
      <div><h1 id="title">Team</h1><div class="tag" id="ptag">Teampanel</div></div>
    </div>
    <nav class="ptabs" id="ptabs"></nav>
    <div class="hud"><span class="err" id="err"></span><span id="upd">laddar…</span><span id="clock">--:--:--</span></div>
  </header>

  <section class="row r1">
    <div class="panel">
      <div class="ptitle">Hur nära målet <small id="msub"></small></div>
      <div class="mission">
        <div class="ring"><svg viewBox="0 0 230 230">
                    <circle cx="115" cy="115" r="96" fill="none" stroke="#F1F0EC" stroke-width="12"/>
          <circle id="arc" cx="115" cy="115" r="96" fill="none" stroke="#2F3437" stroke-width="12" stroke-linecap="butt" stroke-dasharray="0 999" style="transition:stroke-dasharray 1.2s"/>
        </svg><div class="center"><div><div class="pct" id="pct">–</div><div class="pct-l">KLART</div></div></div></div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="note" id="goal"></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>

  <section class="members" id="members"></section>

  <section class="row r3">
    <div class="panel">
      <div class="ptitle">PR:er per dag <small>öppnade, per medlem, senaste 14 dagarna</small></div>
      <div class="legend" id="leg"></div>
      <div id="chart"></div>
    </div>
    <div class="panel">
      <div class="ptitle">Topplista <div class="seg" id="lbmode"><button data-m="commits" class="on">Commits i main</button><button data-m="prs">Mergade PR</button></div></div>
      <div class="rankhero" id="rankhero"></div>
      <div class="lb" id="lb"></div>
      <div class="note" id="lbnote"></div>
    </div>
  </section>

  <section class="panel">
    <div class="ptitle">Senaste händelser <small>pushar och PR:er, 7 dagar</small></div>
    <div class="feed" id="feed"></div>
  </section>
</div>
<div id="tip"></div>
<script>
const PAL=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#6250d6","#e34948"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,P=null,lbMode="commits",live={};
let PID=(()=>{const u=new URLSearchParams(location.search).get("p");if(u)return u;try{return localStorage.getItem("teampanel.p")||""}catch(e){return""}})();
const now=()=>Math.floor(Date.now()/1000);
function ago(t){if(!t)return"aldrig";const s=Math.max(0,now()-t);if(s<60)return"nyss";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";return Math.floor(s/86400)+" d"}
const tip=document.getElementById("tip");
function showTip(e,h){tip.innerHTML=h;tip.style.display="block";let x=e.clientX+14,y=e.clientY+14;if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-14;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.display="none"}
const col=name=>PAL[Math.max(0,D.members.findIndex(m=>m.name===name))%PAL.length];
function memberFor(ref){const r=(ref||"").toLowerCase();for(const m of D.members)for(const p of m.prefixes)if(r.startsWith(p.toLowerCase()))return m.name;
  return (D.members.find(m=>m.default)||D.members[0]).name}
function pushes(){const own=(P.pushes||[]).slice();for(const e of (live[P.id]||[]))if(!own.some(o=>o.time===e.time&&o.branch===e.branch))own.push(e);return own.sort((a,b)=>b.time-a.time)}

function renderTabs(){
  document.getElementById("title").textContent=D.title;
  document.getElementById("ptag").textContent=P.name+" · teampanel, uppdateras automatiskt";document.title=D.title+" · "+P.name;
  const t=document.getElementById("ptabs");
  t.innerHTML=D.projects.map(p=>`<button data-p="${esc(p.id)}" class="${p.id===P.id?"on":""}">${esc(p.name)}</button>`).join("");
  t.querySelectorAll("button").forEach(b=>b.onclick=()=>{PID=b.dataset.p;try{localStorage.setItem("teampanel.p",PID)}catch(e){};pick();render();loadLive()});
}
function renderMission(){const m=P.milestones,C=2*Math.PI*96;
  document.getElementById("arc").setAttribute("stroke-dasharray",`${C*m.percent/100} ${C}`);
  document.getElementById("pct").textContent=m.percent+"%";document.getElementById("msub").textContent=`${m.done} av ${m.total} klara`;
  document.getElementById("goal").textContent=m.goal;
  document.getElementById("steps").innerHTML=m.items.map(i=>`<div class="step ${i.state} ${i.weight>1?"big":""}"><b>${i.state==="done"?"✓":i.state==="partial"?"◐":""}</b><span title="${esc(i.name)}">${esc(i.name)}</span>${i.weight>1?`<span class="w">${i.weight} p</span>`:""}</div>`).join("")}
function renderKpis(){const t=P.team,L=P.leader.commits;
  document.getElementById("kpis").innerHTML=[
   ["PR:er öppnade",t.opened,`${t.open} öppna just nu`],["Mergade",t.merged,`in i ${esc(P.repo)}`],
   ["Commits i main",t.commits,`kontot ${esc(D.account)}`],["Plats i topplistan",L.best_rank_ex_owner?"#"+L.best_rank_ex_owner:"–",`av ${L.total}, ägaren ej räknad`]]
   .map(([k,v,s])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("")}
function status(last){const m=(now()-last)/60;if(!last||m>=D.stopped_minutes)return["stopped","STANNAT"];if(m>=D.quiet_minutes)return["quiet","TYST"];return["ok","AKTIV"]}
function spark(days,c){const w=300,h=42,v=days.map(d=>d.opened+d.merged),max=Math.max(1,...v),n=v.length;
  const pts=v.map((x,i)=>`${(i*w/(n-1)).toFixed(1)},${(h-4-(x/max)*(h-10)).toFixed(1)}`).join(" L");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%"><path d="M${pts}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
let LOCAL=null;
async function loadLocal(){try{const r=await fetch(`https://raw.githubusercontent.com/${D.account}/teampanel/live/status.json?t=${Date.now()}`,{cache:"no-store"});if(r.ok){LOCAL=await r.json();if(D)renderMembers()}}catch(e){}}
function localFor(name){return LOCAL&&now()-LOCAL.time<15*60?(LOCAL.members.find(m=>m.id.toLowerCase()===name.toLowerCase())||null):null}
function renderMembers(){const ev=pushes();
  document.getElementById("members").innerHTML=P.people.map(p=>{
    const mine=ev.filter(e=>memberFor(e.branch)===p.name),lp=Math.max(p.last_push,...mine.map(e=>e.time),0),br=(mine[0]||{}).branch||p.last_branch;
    const L=localFor(p.name),run=L&&L.terminal==="kör";
    const last=Math.max(lp,p.last_pr,run?L.last_session:0,run?L.last_edit:0);let [cls,lbl]=status(last);if(L&&!run){cls="stopped";lbl="TERMINAL STÄNGD"}const c=col(p.name);
    let h=`<div class="panel member" style="--c:${c}"><div class="head"><h2><span class="sw"></span>${esc(p.name)}</h2><span class="chip ${cls}"><i></i>${lbl}</span></div>
      <div class="sub">${lp?`Senaste push för ${ago(lp)} sedan${br?` på <span class="mono">${esc(br)}</span>`:""}`:"Ingen push ännu"} · ${p.last_pr?`senaste PR-händelse för ${ago(p.last_pr)} sedan`:"ingen PR ännu"}</div>
      <div class="stats"><div class="stat"><div class="n">${p.opened}</div><div class="l">PR öppnade</div></div><div class="stat"><div class="n">${p.merged}</div><div class="l">mergade</div></div>
      <div class="stat"><div class="n">${p.open}</div><div class="l">öppna nu</div></div><div class="stat"><div class="n">${mine.filter(e=>now()-e.time<86400).length}</div><div class="l">pushar 24 h</div></div></div>
      <div class="sub">PR-aktivitet per dag, 14 dagar</div>${spark(p.days,c)}`;
    if(L)h+=`<div class="local"><b>Terminal på datorn:</b> ${run?`kör, Claude senast aktiv ${since(L.last_session)}`:esc(L.terminal)}${L.task?`<br><b>Uppgift:</b> ${esc(L.task.id)}${L.task.text?" – "+esc(L.task.text):""}${L.task.pr?` (PR #${L.task.pr})`:""}`:""}${L.branch?`<br><b>Gren:</b> <span class="mono">${esc(L.branch)}</span>`:""}${L.dirty?` · ${L.dirty} ändrade filer`:""}</div>`;
    if(!p.recent.length)h+=`<div class="sub">Inga PR:er ännu. Grenar ska börja med <span class="mono">${esc(D.members.find(m=>m.name===p.name).prefixes[0])}</span></div>`;
    for(const r of p.recent)h+=`<div class="pr"><span class="badge ${r.state}">${{OPEN:"öppen",DRAFT:"utkast",MERGED:"mergad",CLOSED:"stängd"}[r.state]}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">#${r.number} ${esc(r.title)}</a> <span class="sub">${ago(r.updated)}</span></div>`;
    return h+`</div>`}).join("")}
function renderChart(){const el=document.getElementById("chart"),W=el.clientWidth||500,H=200,pl=28,pr=8,pt=8,pb=24,ppl=P.people,n=ppl[0]?ppl[0].days.length:14;
  document.getElementById("leg").innerHTML=ppl.map(p=>`<span><i style="background:${col(p.name)}"></i>${esc(p.name)}</span>`).join("");
  const tot=i=>ppl.reduce((s,p)=>s+p.days[i].opened,0),raw=Math.max(2,...Array.from({length:n},(_,i)=>tot(i))),ts=Math.ceil(raw/4),tk=Math.ceil(raw/ts),max=ts*tk;
  const gw=(W-pl-pr)/n,bw=Math.max(4,Math.min(22,gw-6)),y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg width="${W}" height="${H}">`;
  for(let k=0;k<=tk;k++){const yy=y(k*ts);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#EAEAEA" ${k?'stroke-dasharray="2 4"':""}/><text class="axis" x="${pl-6}" y="${yy+4}" text-anchor="end">${k*ts}</text>`}
  for(let i=0;i<n;i++){let acc=0;const x0=pl+gw*i+(gw-bw)/2,day=new Date(ppl[0].days[i].start*1000).toLocaleDateString("sv-SE",{day:"numeric",month:"numeric"});
    for(const p of ppl){const v=p.days[i].opened;if(!v)continue;const y1=y(acc+v),y0=y(acc);s+=`<rect class="b" data-t="${day} · ${esc(p.name)}: ${v} öppnade" x="${x0}" y="${y1}" width="${bw}" height="${Math.max(1,y0-y1-2)}" rx="2" fill="${col(p.name)}"/>`;acc+=v}
    if(i%2===(n-1)%2)s+=`<text class="axis" x="${x0+bw/2}" y="${H-6}" text-anchor="middle">${day}</text>`}
  el.innerHTML=s+"</svg>";el.querySelectorAll(".b").forEach(b=>{b.onmousemove=e=>showTip(e,esc(b.dataset.t));b.onmouseleave=hideTip})}
function renderBoard(){const B=P.leader[lbMode],unit=lbMode==="commits"?"commits":"mergade PR",me=B.best_member;
  document.getElementById("rankhero").innerHTML=me?`<div class="big">#${B.best_rank_ex_owner}<small> av ${B.total}</small></div><div class="txt">${esc(me.login)} har ${me.n} ${unit}, ägaren ${esc(P.owner)} ej räknad. ${B.next?`${B.next.gap} till för att gå om <b>${esc(B.next.login)}</b>.`:"Ni leder."}</div>`:`<div class="txt">Inte med i listan än.</div>`;
  const max=Math.max(1,...B.top.filter(r=>!r.owner).map(r=>r.n));let prev=0;
  document.getElementById("lb").innerHTML=B.top.map(r=>{const gap=r.rank-prev>1&&prev?'<div class="lbr"><span class="rk">⋮</span></div>':"";prev=r.rank;
    return gap+`<div class="lbr ${r.member?"me":""} ${r.owner?"owner":""}"><span class="rk">${r.rank}</span><span class="nm">${esc(r.login)}</span><span class="bar"><i style="width:${Math.min(100,100*r.n/max)}%"></i></span><span class="v">${r.n}</span></div>`}).join("");
  document.getElementById("lbnote").textContent=(lbMode==="commits"?`Commits i ${P.repo} enligt GitHub.`:`Mergade pull requests mot ${P.repo}.`)+" Konton för botar och kontot claude räknas inte. Ägarens stapel är kapad så att resten syns."}
function renderFeed(){const ev=pushes().filter(e=>now()-e.time<7*86400).map(e=>({time:e.time,who:memberFor(e.branch),kind:"push",text:e.branch,meta:e.commits?`${e.commits} commit${e.commits===1?"":"s"} pushad`:"pushad till forken"}));
  const all=ev.concat(P.feed).sort((a,b)=>b.time-a.time).slice(0,50),K={push:"PUSH",pr:"NY PR",merge:"MERGAD"};
  document.getElementById("feed").innerHTML=all.map(e=>{const body=`<div class="top"><span class="kind">${K[e.kind]} · ${esc(e.who)}</span><span>${ago(e.time)}</span></div><div class="txt">${esc(e.text)}</div><div class="sub mono">${esc(e.meta)}</div>`;
    return `<div class="ev"><span class="dot" style="background:${col(e.who)}"></span><div>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${body}</a>`:body}</div></div>`}).join("")||'<div class="sub">Inget de senaste 7 dagarna.</div>'}
function pick(){P=D.projects.find(p=>p.id===PID)||D.projects[0];PID=P.id}
const prLive={};let lastLive=0,liveErr="";
function recompute(p){if(!p.ours)return;const byN=new Map(p.ours.map(x=>[x.n,x]));for(const x of (prLive[p.id]||[]))byN.set(x.n,x);const all=[...byN.values()],t=now();
  const d=new Date();d.setHours(0,0,0,0);const d0=Math.floor(d/1000);
  p.people=p.people.map(pp=>{const prs=all.filter(x=>memberFor(x.r)===pp.name),days=[];
    for(let i=13;i>=0;i--){const st=d0-i*86400;days.push({start:st,opened:prs.filter(x=>x.c>=st&&x.c<st+86400).length,merged:prs.filter(x=>x.m>=st&&x.m<st+86400).length})}
    return Object.assign({},pp,{opened:prs.length,merged:prs.filter(x=>x.s==="MERGED").length,open:prs.filter(x=>x.s==="OPEN"||x.s==="DRAFT").length,
      closed:prs.filter(x=>x.s==="CLOSED").length,last_pr:Math.max(0,...prs.map(x=>Math.max(x.c,x.m))),days,
      recent:prs.slice().sort((a,b)=>b.up-a.up).slice(0,6).map(x=>({number:x.n,title:x.t,url:x.u,state:x.s,branch:x.r,updated:x.up}))})});
  for(const k of ["opened","merged","open","closed"])p.team[k]=p.people.reduce((s,x)=>s+x[k],0);
  p.feed=[];for(const x of all){const who=memberFor(x.r);if(t-x.c<7*86400)p.feed.push({time:x.c,who,kind:"pr",text:x.t,meta:`PR #${x.n} öppnad`,url:x.u});
    if(x.m&&t-x.m<7*86400)p.feed.push({time:x.m,who,kind:"merge",text:x.t,meta:`PR #${x.n} mergad`,url:x.u})}}
const since=t=>now()-t<60?"nyss":`för ${ago(t)} sedan`;
function status_line(){return `Data uppdaterad ${since(D.built)} · topplistan ${since(D.projects[0].leader_built||D.built)}${liveErr?" · "+liveErr:""}`}
function render(){if(!D)return;pick();recompute(P);renderTabs();renderMission();renderKpis();renderMembers();renderChart();renderBoard();renderFeed();
  document.getElementById("upd").textContent=status_line()}
async function getJSON(u){try{const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
async function loadData(){
  const [pages,live]=await Promise.all([getJSON("data.json"),getJSON("https://raw.githubusercontent.com/Vonsek/teampanel/live/data.json")]);
  const best=[pages,live].filter(x=>x&&x.projects).sort((a,b)=>b.built-a.built)[0];
  if(!best){document.getElementById("err").textContent="Kunde inte läsa data";return}
  D=best;if(D.local)LOCAL=D.local;document.getElementById("err").textContent="";render()}
const etags={};
async function gh(key,url){const h={"Accept":"application/vnd.github+json"};if(etags[key])h["If-None-Match"]=etags[key];
  const r=await fetch(url,{headers:h});if(r.status===304){lastLive=now();return null}
  if(!r.ok){liveErr=r.status===403||r.status===429?"GitHubs gräns för livehämtning nådd, försöker igen snart":"livehämtning misslyckades";return null}
  liveErr="";lastLive=now();etags[key]=r.headers.get("ETag");return r.json()}
async function loadLive(){if(!D)return;const p=P||D.projects[0];
  try{const j=await gh("pr"+p.id,`https://api.github.com/repos/${p.repo}/pulls?state=all&sort=updated&direction=desc&per_page=50`);
    if(j)prLive[p.id]=j.filter(x=>x.user&&x.user.login.toLowerCase()===D.account.toLowerCase()).map(x=>({n:x.number,t:x.title,u:x.html_url,r:x.head.ref,
      s:x.state==="open"&&x.draft?"DRAFT":x.merged_at?"MERGED":x.state==="open"?"OPEN":"CLOSED",c:Math.floor(Date.parse(x.created_at)/1000),
      m:x.merged_at?Math.floor(Date.parse(x.merged_at)/1000):0,up:Math.floor(Date.parse(x.updated_at)/1000)}))}catch(e){}
  for(const p2 of [p]){try{
  const ev=await gh("ev"+p2.id,`https://api.github.com/repos/${p2.fork}/events?per_page=100`);if(!ev)continue;const p=p2;
  live[p.id]=ev.filter(e=>e.type==="PushEvent").map(e=>{const ref=(e.payload.ref||"").replace("refs/heads/","");return{time:Math.floor(Date.parse(e.created_at)/1000),branch:ref,commits:(e.payload.commits||[]).length||e.payload.size||0}})}catch(e){}}render()}
document.getElementById("lbmode").onclick=e=>{const b=e.target.closest("button");if(!b)return;lbMode=b.dataset.m;document.querySelectorAll("#lbmode button").forEach(x=>x.classList.toggle("on",x===b));renderBoard()};
setInterval(()=>{document.getElementById("clock").textContent=new Date().toLocaleTimeString("sv-SE")},1000);
setInterval(()=>{if(D){renderMembers();document.getElementById("upd").textContent=status_line()}},30000);
addEventListener("resize",()=>{if(D)renderChart()});
loadData().then(()=>{loadLive()});setInterval(loadData,60000);setInterval(loadLive,150000);
</script>
